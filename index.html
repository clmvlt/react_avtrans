    <!-- Script inline anti-FOUC (Flash of Unstyled Content), identique au projet Vue.
         La landing (/) est toujours en thème clair : on n'y applique pas .dark, sinon le HTML
         pré-rendu (voir scripts/prerender.cjs) clignoterait en sombre avant le montage de React. -->
    <script>
      ;(function () {
        if (location.pathname === '/') return
        const stored = localStorage.getItem('theme-preference')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const isDark = stored === 'dark' || (stored !== 'light' && prefersDark)
        if (isDark) document.documentElement.classList.add('dark')
      })()
    </script>
