# En-têtes de cache pour le vhost Apache de pointage.avtrans-concept.com
# (DocumentRoot /var/www/html/avtrans_concept).
#
# Installation (une seule fois, sur le VPS) :
#     sudo cp deploy/apache-cache-headers.conf /etc/apache2/conf-available/avtrans-cache-headers.conf
#     sudo a2enmod headers
#     puis dans le <VirtualHost> du site :  Include conf-available/avtrans-cache-headers.conf
#     sudo apachectl configtest && sudo systemctl reload apache2
#
# Pourquoi : le client détecte une mise à jour en comparant la version de son bundle
# (__APP_VERSION__) à /version.json. Pour que cela fonctionne, index.html et version.json ne
# doivent jamais être servis depuis le cache navigateur. Sans Cache-Control, les navigateurs
# appliquent une durée heuristique (fonction de Last-Modified) et peuvent garder l'ancien
# index.html — donc l'ancien bundle — pendant des heures, surtout en PWA installée.
# Les assets hashés par Vite (/assets/*) peuvent au contraire être mis en cache un an.
#
# deploy/deploy.py vérifie ces en-têtes après chaque déploiement.

<IfModule mod_headers.c>
    # Coquille SPA : toujours revalidée (ETag / Last-Modified), jamais servie périmée
    <Files "index.html">
        Header set Cache-Control "no-cache, must-revalidate"
    </Files>

    # Version déployée : jamais en cache
    <Files "version.json">
        Header set Cache-Control "no-store, no-cache, must-revalidate"
    </Files>

    # Manifest PWA : revalidé à chaque lancement
    <Files "manifest.json">
        Header set Cache-Control "no-cache, must-revalidate"
    </Files>

    # Assets hashés par Vite (nom de fichier = empreinte du contenu) : cache immuable 1 an
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
</IfModule>
